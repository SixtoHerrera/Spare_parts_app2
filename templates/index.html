<!DOCTYPE html>
<html>
<head>
    <title>Spare Parts Manager</title>
</head>
<body>

    <h1>Spare Parts Manager</h1>

    <h2>Add New Part</h2>

    <input id="part_number" placeholder="Part Number"><br><br>
    <input id="description" placeholder="Description"><br><br>
    <input id="category" placeholder="Category"><br><br>
    <input id="location" placeholder="Location"><br><br>
    <input id="min_stock" type="number" placeholder="Min Stock"><br><br>
    <input id="max_stock" type="number" placeholder="Max Stock"><br><br>
    <input id="current_stock" type="number" placeholder="Current Stock"><br><br>

    <button onclick="addPart()">Add Part</button>

    <h2>Parts List</h2>
    <button onclick="loadParts()">Refresh List</button>

    <ul id="partsList"></ul>
    <h2>Transaction History</h2>
<button onclick="loadTransactions()">Load History</button>

<ul id="transactionList"></ul>

    <script>
        function addPart() {
            fetch("/parts", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    part_number: document.getElementById("part_number").value,
                    description: document.getElementById("description").value,
                    category: document.getElementById("category").value,
                    location: document.getElementById("location").value,
                    min_stock: parseInt(document.getElementById("min_stock").value),
                    max_stock: parseInt(document.getElementById("max_stock").value),
                    current_stock: parseInt(document.getElementById("current_stock").value)
                })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                loadParts();
            });
        }

        function loadParts() {
    fetch("/parts")
    .then(res => res.json())
    .then(data => {
        let list = document.getElementById("partsList");
        list.innerHTML = "";

        data.forEach(part => {
            let item = document.createElement("li");

            let currentStock = part[7];
            let minStock = part[5];

            // 🚨 Check if low stock
            let isLow = currentStock < minStock;

            // Apply styling
            item.style.color = isLow ? "red" : "black";

            item.innerHTML = `
                <strong>${part[1]}</strong> - ${part[2]} 
                | Stock: ${currentStock} 
                | Min: ${minStock}
                | Location: ${part[4]}
                ${isLow ? "<b> ⚠ LOW STOCK</b>" : ""}
                <br><br>

                Qty: <input type="number" id="qty-${part[0]}" value="1" style="width:60px;">

                <button onclick="issuePart(${part[0]})">Issue</button>
                <button onclick="receivePart(${part[0]})">Receive</button>

                <hr>
            `;

            list.appendChild(item);
        });
    });
}
function issuePart(partId) {
    let qty = parseInt(document.getElementById(`qty-${partId}`).value);

    updateStock(partId, -qty);
}

function receivePart(partId) {
    let qty = parseInt(document.getElementById(`qty-${partId}`).value);

    updateStock(partId, qty);
}
function updateStock(partId, change) {
    fetch("/update_stock", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            part_id: partId,
            change: change
        })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        loadParts();
    });
}

function updateStock(partId, change) {
    fetch("/update_stock", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            part_id: partId,
            change: change
        })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        loadParts();
    });
}
function loadTransactions() {
    fetch("/transactions")
    .then(res => res.json())
    .then(data => {
        let list = document.getElementById("transactionList");
        list.innerHTML = "";

        data.forEach(tx => {
            let item = document.createElement("li");

            item.textContent = 
                "Part: " + tx[1] +
                " | Type: " + tx[2] +
                " | Qty: " + tx[3] +
                " | Date: " + tx[4];

            list.appendChild(item);
        });
    });
}
    </script>

</body>
</html>
